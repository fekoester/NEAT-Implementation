# Settings from Stanley & Miikkulainen (2002) for XOR, usable with:
#   neat_train --env xor --config configs/xor_paper.cfg
population_size = 150
sigmoid_steepness = 4.9
weight_mutate_prob = 0.8
weight_perturb_prob = 0.9
add_node_prob = 0.03
add_connection_prob = 0.05
crossover_prob = 0.75
interspecies_mating_prob = 0.001
disabled_gene_inherit_prob = 0.75
c_excess = 1.0
c_disjoint = 1.0
c_weight = 0.4
compatibility_threshold = 3.0
stagnation_generations = 15
elitism_min_species_size = 5
